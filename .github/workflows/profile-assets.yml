name: Update profile components

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
  push:
    paths:
      - '.github/workflows/profile-assets.yml'
      - 'scripts/render-stats.mjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: profile-components
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake-latte.svg?color_snake=#df8e1d&color_dots=#e6e9ef,#6085ca,#3169c8,#7942c2,#a1247d
            profile/snake-mocha.svg?color_snake=#f9e2af&color_dots=#2a2d3e,#6c95db,#89b4fa,#cba6f7,#f5c2e7

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Install statistics renderer
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate public statistics
        run: npm run stats
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize SVGs and respect reduced motion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('profile').glob('snake-*.svg'):
              svg = path.read_text()
              rule = '@media (prefers-reduced-motion: reduce){.s,.c,.u{animation:none!important}}'
              svg = svg.replace('</style>', rule + '</style>', 1)
              path.write_text(svg)
          for path in Path('profile').glob('*.svg'):
              path.write_text('\n'.join(line.rstrip() for line in path.read_text().splitlines()).rstrip() + '\n')
          import xml.etree.ElementTree as ET
          for path in Path('profile').glob('*.svg'):
              ET.parse(path)
              svg = path.read_text()
              if 'Something went wrong' in svg or 'Resource not accessible' in svg:
                  raise SystemExit(f'{path.name}: renderer returned an error card')
          PY

      - name: Save generated images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile/*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Update profile activity images'
          git push
